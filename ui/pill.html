<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matalu</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: transparent; overflow: hidden;
    /* Display-only: never intercept clicks meant for the app behind us. */
    user-select: none; -webkit-user-select: none; cursor: default;
  }
  body {
    display: flex; align-items: center; justify-content: center;
    font: 13px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  .pill {
    display: flex; align-items: center; gap: 9px;
    max-width: 236px; height: 40px; padding: 0 15px;
    border-radius: 20px;
    background: rgba(22, 24, 30, 0.92);
    border: 1px solid rgba(255, 255, 255, 0.08);
    box-shadow: 0 6px 22px rgba(0, 0, 0, 0.45);
    color: #e7e9ee;
    -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
  }
  .dot {
    flex: 0 0 auto; width: 9px; height: 9px; border-radius: 50%;
    background: #d15b5b;
  }
  .pill.listening .dot {
    background: #4caf72;
    box-shadow: 0 0 0 0 rgba(76, 175, 114, 0.6);
    animation: pulse 1.4s ease-out infinite;
  }
  @keyframes pulse {
    0%   { box-shadow: 0 0 0 0 rgba(76, 175, 114, 0.55); }
    70%  { box-shadow: 0 0 0 8px rgba(76, 175, 114, 0); }
    100% { box-shadow: 0 0 0 0 rgba(76, 175, 114, 0); }
  }
  .text {
    flex: 1 1 auto; min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    direction: rtl; text-align: left; /* keep the newest (tail) text visible */
  }
  .text.muted { color: #8b90a0; font-style: italic; }
</style>
</head>
<body>
  <div class="pill listening" id="pill">
    <span class="dot"></span>
    <span class="text muted" id="text">Listening…</span>
  </div>

  <script>
    const pill = document.getElementById('pill');
    const textEl = document.getElementById('text');

    function setText(t) {
      if (t && t.trim()) {
        textEl.textContent = t;
        textEl.classList.remove('muted');
      } else {
        textEl.textContent = 'Listening…';
        textEl.classList.add('muted');
      }
    }

    function onEvent(m) {
      // partial + final both update the live line; the window is only visible
      // during a dictation window, so we just mirror the latest text.
      setText(m.text);
      if (m.type === 'final') {
        // brief settle so the committed words are readable before it hides
        setTimeout(() => { if (textEl.textContent === m.text) setText(''); }, 500);
      }
    }

    function onStatus(s) {
      s = s || {};
      if (s.listening) {
        pill.classList.add('listening');
        setText('');
      } else {
        // draining / idle: stop pulsing but leave the last words a moment
        pill.classList.remove('listening');
      }
    }

    async function start() {
      if (!window.__TAURI__ || !window.__TAURI__.event) return;
      const { listen } = window.__TAURI__.event;
      await listen('transcript', (e) => onEvent(e.payload));
      await listen('status', (e) => onStatus(e.payload));
    }
    start();
  </script>
</body>
</html>
