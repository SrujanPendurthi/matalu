<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Matalu</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e7e9ee;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid #23262e;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  #status { font-size: 13px; color: #8b90a0; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .btn { font: inherit; font-size: 13px; color: #cfd3df; background: #1a1d25;
         border: 1px solid #2c303b; border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  .btn:hover { background: #232733; }
  .btn:active { background: #2c313f; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #d15b5b; }
  #dot.on { background: #4caf72; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .line { margin: 0 0 10px; }
  .final { color: #e7e9ee; }
  .partial { color: #9aa0b4; }
  #partial:empty { display: none; }
  #partial { padding-left: 10px; border-left: 2px solid #3a5cff; }
  .cursor { display: inline-block; width: 7px; height: 1.1em; vertical-align: text-bottom;
            background: #3a5cff; margin-left: 2px; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: #6b7080; font-style: italic; }
  footer { padding: 8px 20px; border-top: 1px solid #23262e; font-size: 12px; color: #6b7080; }
</style>
</head>
<body>
  <header>
    <h1>Matalu</h1>
    <span id="status"><span id="dot"></span><span id="statustext">starting…</span></span>
    <button id="save" class="btn">Save</button>
    <button id="clear" class="btn">Clear</button>
  </header>
  <main id="log">
    <p class="empty" id="hint">Finalized lines appear here; live text below.</p>
  </main>
  <p class="line partial" id="partial"></p>
  <footer id="footer">Transcripts stream over Tauri IPC (<code>transcript</code> event).</footer>

  <script>
    const log = document.getElementById('log');
    const partialEl = document.getElementById('partial');
    const dot = document.getElementById('dot');
    const statustext = document.getElementById('statustext');
    const footer = document.getElementById('footer');
    let hint = document.getElementById('hint');
    const finals = [];  // committed transcript lines, for Save

    function onEvent(m) {
      if (hint) { hint.remove(); hint = null; }
      dot.classList.add('on');
      if (m.type === 'partial') {
        partialEl.innerHTML = '';
        partialEl.append(document.createTextNode(m.text));
        const c = document.createElement('span'); c.className = 'cursor'; partialEl.append(c);
      } else if (m.type === 'final') {
        finals.push(m.text);
        const p = document.createElement('p');
        p.className = 'line final';
        p.textContent = m.text;
        log.append(p);
        partialEl.innerHTML = '';
        log.scrollTop = log.scrollHeight;
      }
    }

    async function saveTranscript() {
      if (!finals.length) { footer.textContent = 'Nothing to save yet.'; return; }
      try {
        const path = await window.__TAURI__.core.invoke('save_transcript', { text: finals.join('\n') });
        footer.textContent = 'Saved: ' + path;
      } catch (e) {
        footer.textContent = 'Save failed: ' + e;
      }
    }

    function clearTranscript() {
      finals.length = 0;
      log.innerHTML = '';
      partialEl.innerHTML = '';
      footer.textContent = 'Cleared.';
    }

    document.getElementById('save').addEventListener('click', saveTranscript);
    document.getElementById('clear').addEventListener('click', clearTranscript);

    let ready = false;
    function onStatus(s) {
      s = s || {};
      if (s.state === 'ready') ready = true;
      if (s.state === 'meeting') {
        dot.classList.add('on');
        statustext.textContent = 'meeting recording';
      } else if (s.listening) {
        dot.classList.add('on');
        statustext.textContent = 'listening';
      } else if (s.state === 'warming' || !ready) {
        dot.classList.remove('on');
        statustext.textContent = 'warming up — loading model…';
      } else {
        dot.classList.remove('on');
        statustext.textContent = 'ready — hold ⌥Space to talk';
      }
    }

    // The core emits TranscriptEvent as {"type":"partial|final","text":...,"ts_ms":...}
    // on 'transcript', and {"listening":bool} on 'status'.
    // withGlobalTauri exposes the event API at window.__TAURI__.event.
    async function start() {
      if (!window.__TAURI__ || !window.__TAURI__.event) {
        statustext.textContent = 'Tauri API unavailable';
        return;
      }
      const { listen } = window.__TAURI__.event;
      await listen('transcript', (e) => onEvent(e.payload));
      await listen('status', (e) => onStatus(e.payload));
      statustext.textContent = 'warming up — loading model…';
    }
    start();
  </script>
</body>
</html>
