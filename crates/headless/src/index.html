<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>matalu — live transcription</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115; color: #e7e9ee;
    display: flex; flex-direction: column; height: 100vh;
  }
  header {
    padding: 12px 20px; border-bottom: 1px solid #23262e;
    display: flex; align-items: center; gap: 10px;
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: .3px; }
  #status { font-size: 13px; color: #8b90a0; margin-left: auto; display: flex; align-items: center; gap: 6px; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #d15b5b; }
  #dot.on { background: #4caf72; }
  main { flex: 1; overflow-y: auto; padding: 20px; }
  .line { margin: 0 0 10px; }
  .final { color: #e7e9ee; }
  .partial { color: #9aa0b4; }
  #partial:empty { display: none; }
  #partial { padding-left: 10px; border-left: 2px solid #3a5cff; }
  .cursor { display: inline-block; width: 7px; height: 1.1em; vertical-align: text-bottom;
            background: #3a5cff; margin-left: 2px; animation: blink 1s step-start infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .empty { color: #6b7080; font-style: italic; }
  footer { padding: 8px 20px; border-top: 1px solid #23262e; font-size: 12px; color: #6b7080; }
</style>
</head>
<body>
  <header>
    <h1>matalu</h1>
    <span id="status"><span id="dot"></span><span id="statustext">connecting…</span></span>
  </header>
  <main id="log">
    <p class="empty" id="hint">Start speaking — finalized lines appear here, live text below.</p>
  </main>
  <p class="line partial" id="partial"></p>
  <footer>Streaming from <code id="url"></code></footer>

  <script>
    const log = document.getElementById('log');
    const partialEl = document.getElementById('partial');
    const dot = document.getElementById('dot');
    const statustext = document.getElementById('statustext');
    const hint = document.getElementById('hint');
    const wsUrl = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
    document.getElementById('url').textContent = wsUrl;

    function connect() {
      const ws = new WebSocket(wsUrl);
      ws.onopen = () => { dot.classList.add('on'); statustext.textContent = 'listening'; };
      ws.onclose = () => {
        dot.classList.remove('on'); statustext.textContent = 'disconnected — retrying…';
        setTimeout(connect, 1000);
      };
      ws.onmessage = (ev) => {
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (hint) { hint.remove(); }
        if (m.type === 'partial') {
          partialEl.innerHTML = '';
          partialEl.append(document.createTextNode(m.text));
          const c = document.createElement('span'); c.className = 'cursor'; partialEl.append(c);
        } else if (m.type === 'final') {
          const p = document.createElement('p');
          p.className = 'line final';
          p.textContent = m.text;
          log.append(p);
          partialEl.innerHTML = '';
          window.scrollTo(0, document.body.scrollHeight);
          log.scrollTop = log.scrollHeight;
        }
      };
    }
    connect();
  </script>
</body>
</html>
