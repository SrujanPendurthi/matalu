[workspace]
resolver = "2"
members = ["crates/core", "crates/headless", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Shared dependency versions (referenced with `.workspace = true` in members).
[workspace.dependencies]
cpal = "0.18"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
crossbeam-channel = "0.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
opt-level = 3
lto = "thin"
