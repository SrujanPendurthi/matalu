# QLoRA for the cleanup model. MLX trains LoRA directly on 4-bit weights, so
# pointing at the quantized model *is* QLoRA — no extra configuration.
#
#   mlx_lm.lora --train -c training/lora_config.yaml
#
# Baseline to beat (training/eval_pipeline.py, row 2 "cleanup on truth"):
#   doing nothing        14.72% WER   <- the disfluency content
#   base model           12.47% WER   <- captures only 15% of the available gain
#   perfect cleanup       0.00% WER

model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"
train: true
fine_tune_type: lora
data: "training/data"
adapter_path: "sidecar/adapters/cleanup"   # picked up automatically by clean_sidecar.py

# Loss on the assistant turn only. Without this, ~75% of every sequence is the
# 1107-char system prompt, and the model would spend its capacity learning to
# reproduce our own instructions.
mask_prompt: true

# 4500 train pairs / batch 4 = ~1125 steps per epoch, so this is ~1 epoch.
# MLX's guidance is 2-5k high-quality examples; more epochs on 4.5k risks
# memorising a single-speaker corpus rather than learning the transform.
iters: 1200
batch_size: 4
num_layers: 16
learning_rate: 1e-5

lora_parameters:
  rank: 8
  dropout: 0.0
  scale: 20.0

# Utterances are short (~30 tokens) but the system prompt is ~263, so sequences
# land near 350. 1024 leaves headroom without padding waste.
max_seq_length: 1024

steps_per_report: 25
steps_per_eval: 100
val_batches: 25
save_every: 200
seed: 0
